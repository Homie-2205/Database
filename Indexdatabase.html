<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Submission Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="tel"] { width: 100%; padding: 8px; max-width: 300px; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Submit Information</h2>
    
    <!-- Replace URL with your actual Google Script Web App URL -->
    <form id="dataForm" action="https://script.google.com/macros/s/AKfycbx4eLJZ_IxccyX6ZOlHnmb-IY1caR8uOy28Tsf_7A4unsgiSf5Uzohf_hJcmqMCqDpm/exec" method="POST">
        <div class="form-group">
            <label for="Name">Name:</label>
            <input type="text" id="Name" name="Name" required>
        </div>
        <div class="form-group">
            <label for="Address">Address:</label>
            <input type="text" id="Address" name="Address" required>
        </div>
        <!-- Added Phone Field Here -->
        <div class="form-group">
            <label for="Phone">Phone Number:</label>
            <input type="tel" id="Phone" name="Phone" required>
        </div>
        <button type="submit" id="submitBtn">Submit Data</button>
    </form>

    <div id="message"></div>

    <script>
        const form = document.getElementById('dataForm');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            messageDiv.textContent = "Submitting...";
            messageDiv.style.color = "black";

            // Convert FormData into application/x-www-form-urlencoded format
            const formData = new FormData(form);
            const urlEncodedData = new URLSearchParams(formData);

            fetch(form.action, {
                method: 'POST',
                body: urlEncodedData
            })
            .then(response => response.json())
            .then(data => {
                submitBtn.disabled = false;
                messageDiv.textContent = "Data submitted successfully!";
                messageDiv.style.color = "green";
                form.reset();
            })
            .catch(error => {
                submitBtn.disabled = false;
                messageDiv.textContent = "Error submitting data. Please check your script.";
                messageDiv.style.color = "red";
                console.error("Submission Error:", error);
            });
        });
    </script>
</body>
</html>
