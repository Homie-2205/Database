<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Assistant</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:white;
    transition:0.5s;
}

#box{
    width:320px;
    min-height:220px;
    background:#555;
    color:white;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    font-size:24px;
}

button{
    position:fixed;
    top:20px;
    left:20px;
    padding:12px 20px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>
<body>

<button id="start">🎤 Start Assistant</button>

<div id="box">
Press Start<br>Then speak...
</div>

<script>

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){
    alert("Speech Recognition is not supported in this browser.");
}

const recognition = new SpeechRecognition();

recognition.lang = "en-US";
recognition.continuous = true;
recognition.interimResults = false;

const box = document.getElementById("box");

function speak(message){
    const speech = new SpeechSynthesisUtterance(message);
    speech.lang = "es-ES";
    speech.rate = 1;
    speech.pitch = 1;
    speechSynthesis.speak(speech);
}

document.getElementById("start").onclick = function(){
    recognition.start();
};

recognition.onend = function(){
    recognition.start();
};

recognition.onresult = function(event){

    let text = event.results[event.results.length-1][0].transcript.toLowerCase();

    box.innerHTML = text;

    if(text.includes("hola")){
        box.style.background="orange";
        box.innerHTML="Hola Cristian";
        speak("Hello! Nice to meet you.");
    }

    else if(text.includes("Buenos dias")){
        box.style.background="green";
        box.innerHTML="Good Morning!";
        speak("Good morning. I hope you have a wonderful day.");
    }

    else if(text.includes("adios")){
        box.style.background="black";
        box.innerHTML="Goodbye!";
        speak("hasta luego que Dios te bendiga.");
    }

    else if(text.includes("rojo")){
        document.body.style.background="rojo";
        speak("Changing background to red.");
    }

    else if(text.includes("verde")){
        document.body.style.background="verde";
        speak("Changing background to green.");
    }

    else if(text.includes("azul")){
        document.body.style.background="azul";
        speak("Changing background to blue.");
    }

    else if(text.includes("blanco")){
        document.body.style.background="blanco";
        speak("Changing background to white.");
    }

    else if(text.includes("que fecha es hoy") || text.includes("today's date")){
        let today = new Date().toDateString();
        box.innerHTML = today;
        speak("Today is " + today);
    }

    else if(text.includes("que hora es")){
        let time = new Date().toLocaleTimeString();
        box.innerHTML = time;
        speak("The time is " + time);
    }

    else if(text.includes("como estas")){
        box.innerHTML="I'm doing great!";
        speak("I'm doing great. Thank you for asking.");
    }

    else if(text.includes("gracias")){
        box.innerHTML="de nada";
        speak("You're welcome.");
    }

    else if(text.includes("clear")){
        document.body.style.background="white";
        box.style.background="#555";
        box.innerHTML="Ready for your next command.";
        speak("Screen cleared.");
    }

    else{
        speak("Sorry, I don't know that command yet.");
    }

};

recognition.onerror = function(e){
    console.log(e);
};

</script>

</body>
</html>
