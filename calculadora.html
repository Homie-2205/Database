<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Neon Glass Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* High-quality dark abstract background image */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://unsplash.com') no-repeat center center/cover;
        }

        .calculator {
            width: 340px;
            padding: 25px;
            border-radius: 25px;
            /* Premium dark glassmorphism card */
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .display-container {
            margin-bottom: 20px;
        }

        .display {
            width: 100%;
            height: 75px;
            border: none;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 0 20px;
            font-size: 2.2rem;
            color: #00ffcc; /* Bright neon teal for digits */
            text-align: right;
            outline: none;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 15px;
            font-size: 1.4rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
        }

        button:active {
            transform: scale(0.95);
        }

        /* 1. Number Buttons (Cool Ice Blue Theme) */
        .btn-num {
            background: rgba(255, 255, 255, 0.08);
            color: #e0e6ed;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn-num:hover {
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* 2. Standard Operators (Vibrant Neon Orange Theme) */
        .btn-operator {
            background: rgba(255, 102, 0, 0.15);
            color: #ff6600;
            border: 1px solid rgba(255, 102, 0, 0.2);
        }
        .btn-operator:hover {
            background: rgba(255, 102, 0, 0.3);
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.4);
        }

        /* 3. Utility Actions (Electric Pink/Magenta Theme) */
        .btn-action {
            background: rgba(255, 0, 128, 0.15);
            color: #ff0080;
            border: 1px solid rgba(255, 0, 128, 0.2);
        }
        .btn-action:hover {
            background: rgba(255, 0, 128, 0.3);
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.4);
        }

        /* 4. Equals Button (Solid Neon Green Highlight) */
        .btn-equal {
            background: #39ff14;
            color: #0b130a;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }
        .btn-equal:hover {
            background: #52ff33;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.7);
        }

        /* Forces standard SVG functional image icons to match text colors */
        .icon-img {
            width: 24px;
            height: 24px;
            stroke: currentColor;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display-container">
            <input type="text" id="screen" class="display" readonly value="0">
        </div>
        
        <div class="buttons-grid">
            <!-- Clear Screen (Pink) -->
            <button class="btn-action" onclick="clearScreen()">C</button>
            
            <!-- Backspace (Pink) -->
            <button class="btn-action" onclick="backspace()">
                <svg class="icon-img" fill="none" viewBox="0 0 24 24" xmlns="http://w3.org">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-7.172a2 2 0 00-1.414.586L3 12z"></path>
                </svg>
            </button>
            
            <!-- Percentage (Pink) -->
            <button class="btn-action" onclick="appendValue('%')">
                <svg class="icon-img" fill="none" viewBox="0 0 24 24" xmlns="http://w3.org">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 7h.01M15 17h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9 17L15 7"></path>
                </svg>
            </button>
            
            <!-- Division (Orange) -->
            <button class="btn-operator" onclick="appendValue('/')">÷</button>

            <!-- Numbers (Ice Blue) -->
            <button class="btn-num" onclick="appendValue('7')">7</button>
            <button class="btn-num" onclick="appendValue('8')">8</button>
            <button class="btn-num" onclick="appendValue('9')">9</button>
            <button class="btn-operator" onclick="appendValue('*')">×</button>

            <button class="btn-num" onclick="appendValue('4')">4</button>
            <button class="btn-num" onclick="appendValue('5')">5</button>
            <button class="btn-num" onclick="appendValue('6')">6</button>
            <button class="btn-operator" onclick="appendValue('-')">−</button>

            <button class="btn-num" onclick="appendValue('1')">1</button>
            <button class="btn-num" onclick="appendValue('2')">2</button>
            <button class="btn-num" onclick="appendValue('3')">3</button>
            <button class="btn-operator" onclick="appendValue('+')">+</button>

            <button class="btn-num" onclick="appendValue('0')" style="grid-column: span 2; width: 100%;">0</button>
            <button class="btn-num" onclick="appendValue('.')">.</button>
            
            <!-- Equals (Bright Green Accent) -->
            <button class="btn-equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const screen = document.getElementById('screen');
        let resetDisplay = false;

        function appendValue(val) {
            if (screen.value === '0' || screen.value === 'Error' || resetDisplay) {
                screen.value = val;
                resetDisplay = false;
            } else {
                screen.value += val;
            }
        }

        function clearScreen() {
            screen.value = '0';
        }

        function backspace() {
            if (screen.value.length > 1 && screen.value !== 'Error') {
                screen.value = screen.value.slice(0, -1);
            } else {
                screen.value = '0';
            }
        }

        function calculate() {
            try {
                let expression = screen.value.replace(/%/g, '/100');
                let result = eval(expression);
                
                if (result % 1 !== 0) {
                    result = parseFloat(result.toFixed(6));
                }
                
                screen.value = result;
                resetDisplay = true;
            } catch (error) {
                screen.value = 'Error';
                resetDisplay = true;
            }
        }
    </script>
</body>
</html>
