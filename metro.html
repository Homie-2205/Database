<!DOCTYPE html>
<html>
<body>
<h2>WebXR Support Test</h2>

<p id="result">Checking...</p>

<script>
async function checkXR() {
    if (!navigator.xr) {
        document.getElementById("result").innerHTML =
            "❌ WebXR is NOT supported.";
        return;
    }

    const supported = await navigator.xr.isSessionSupported("immersive-ar");

    document.getElementById("result").innerHTML =
        supported
        ? "✅ WebXR AR is supported!"
        : "❌ WebXR exists, but AR is not supported.";
}

checkXR();
</script>

</body>
</html>
