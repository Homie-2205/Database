<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15 Meter Camera</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    text-align:center;
    margin:20px;
}

h2{
    color:#333;
}

video{
    width:95%;
    max-width:500px;
    border:3px solid #333;
    border-radius:10px;
}

.meter{
    width:300px;
    height:30px;
    border:2px solid #333;
    border-radius:15px;
    margin:20px auto;
    overflow:hidden;
    background:#ddd;
}

.fill{
    width:0%;
    height:100%;
    background:limegreen;
    transition:0.2s;
}

p{
    font-size:20px;
    font-weight:bold;
}

input[type=range]{
    width:300px;
}
</style>

</head>
<body>

<h2>15 Meter Camera</h2>

<video id="camera" autoplay playsinline></video>

<div class="meter">
    <div class="fill" id="fill"></div>
</div>

<p><span id="value">0</span> / 15 meters</p>

<input type="range" id="slider" min="0" max="15" step="0.1" value="0">

<script>
const video = document.getElementById("camera");

navigator.mediaDevices.getUserMedia({
    video:{
        facingMode:"environment"
    }
})
.then(stream=>{
    video.srcObject=stream;
})
.catch(error=>{
    alert("Unable to access the camera.");
    console.error(error);
});

const slider = document.getElementById("slider");
const fill = document.getElementById("fill");
const value = document.getElementById("value");

slider.addEventListener("input", function(){
    value.textContent = this.value;
    fill.style.width = (this.value / 15 * 100) + "%";
});
</script>

</body>
</html>
