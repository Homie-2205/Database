<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Submission Form</title>
    <style>

     body { 
        background-image: url("fondo.jpg");
        font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;  }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; max-width: 300px; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Submit Information</h2>
    
    <!-- Replace URL with your actual Google Script Web App URL -->
    <form id="dataForm" action="https://script.google.com/macros/s/AKfycbx4eLJZ_IxccyX6ZOlHnmb-IY1caR8uOy28Tsf_7A4unsgiSf5Uzohf_hJcmqMCqDpm/exec" method="POST">
        <div class="form-group">
            <label for="Name">Name:</label>
            <input type="text" id="Name" name="Name" required>
        </div>
        <div class="form-group">
            <label for="Address">Address:</label>
            <input type="text" id="Address" name="Address" required>
        </div>
        <button type="submit" id="submitBtn">Submit Data</button>
    </form>

    <h2> <a href="indexdata.html" class="w3-bar-item w3-button">Indexdata</a></h2>
  <h2> <a href="Database2.html" class="w3-bar-item w3-button">Indexdata</a></h2>
    <h2> <a href="Database3.html" class="w3-bar-item w3-button">Indexdata3</a></h2>
      <h2> <a href="screen.html" class="w3-bar-item w3-button">Screen</a></h2>
    <h2> <a href="notas lote.html" class="w3-bar-item w3-button">Notas</a></h2>
         <h2> <a href="metro.html" class="w3-bar-item w3-button">Metro</a></h2>

<h2> <a href="Metro XR.html" class="w3-bar-item w3-button">Metro XR</a></h2>

    <div id="message"></div>


    <script>
const form = document.getElementById('dataForm');
const messageDiv = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', function(e) {
    e.preventDefault();
    submitBtn.disabled = true;
    messageDiv.textContent = "Submitting...";
    messageDiv.style.color = "black";

    // FIX: Convert FormData into application/x-www-form-urlencoded format
    const formData = new FormData(form);
    const urlEncodedData = new URLSearchParams(formData);

    fetch(form.action, {
        method: 'POST',
        body: urlEncodedData, // Sends Name and Address in a format Google Script reads natively
        mode: 'no-cors' 
    })
    .then(response => {
        // With 'no-cors', we assume success if the network request completed.
        messageDiv.textContent = "Data sent successfully!";
        messageDiv.style.color = "green";
        form.reset();
    })
    .catch(error => {
        console.error('--- DATABASE CONNECTION ERROR LOG ---');
        console.error('Error Details:', error.message);
        console.error('Target URL:', form.action);
        
        messageDiv.textContent = "Submission error. Check console.";
        messageDiv.style.color = "red";
    })
    .finally(() => {
        submitBtn.disabled = false;
    });
});
        </script>

</body>
</html>
