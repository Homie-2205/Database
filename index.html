    <style>/* Reset and Base Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f4f7f6;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

/* Container */
.menu-container {
    background: #ffffff;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    width: 100%;
    max-width: 500px;
    text-align: center;
}

h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 25px;
    color: #1a1a1a;
    letter-spacing: -0.5px;
}

/* Button Grid Layout */
.button-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* 2 equal columns */
    gap: 12px; /* Space between buttons */
}

/* Responsive: 1 column on very small screens */
@media (max-width: 360px) {
    .button-grid {
        grid-template-columns: 1fr;
    }
}

/* Navigation Buttons */
.nav-button {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 20px;
    background-color: #007aff; /* Modern blue */
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    border-radius: 12px;
    transition: background-color 0.2s ease, transform 0.1s ease;
    text-transform: capitalize; /* Capitalizes first letter of labels automatically */
}

/* Button Interactions */
.nav-button:hover {
    background-color: #0062cc;
}

.nav-button:active {
    transform: scale(0.98); /* Click shrink effect */
}
</style>
