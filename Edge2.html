
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contorno de Objeto en Tiempo Real</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111;
            font-family: Arial, sans-serif;
        }
        #contenedor {
            position: relative;
            width: 640px;
            height: 480px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
        }
        canvas {
            pointer-events: none;
        }
        #cargando {
            position: absolute;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px 25px;
            border-radius: 20px;
            z-index: 10;
        }
    </style>

    <!-- Importar MediaPipe Tasks Vision -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
</head>
<body>

    <div id="cargando">Cargando modelo de IA...</div>

    <div id="contenedor">
        <video id="camara" autoplay playsinline></video>
        <canvas id="lienzo"></canvas>
    </div>

<script type="module">
    import { ImageSegmenter, FilesetResolver } from "https://jsdelivr.net";

    const video = document.getElementById("camara");
    const canvas = document.getElementById("lienzo");
    const ctx = canvas.getContext("2d");
    const cargandoTxt = document.getElementById("cargando");

    let imageSegmenter;
    let width = 640;
    let height = 480;

    // 1. Inicializar el Segmentador de MediaPipe
    async function inicializarIA() {
        const vision = await FilesetResolver.forVisionTasks(
            "https://jsdelivr.net"
        );
        
        imageSegmenter = await ImageSegmenter.createFromOptions(vision, {
            baseOptions: {
                modelAssetPath: "https://googleapis.com",
                delegate: "GPU"
            },
            runningMode: "VIDEO",
            outputCategoryMask: true,
            outputConfidenceMasks: false
        });

        cargandoTxt.style.display = "none";
        activarCamara();
    }

    // 2. Encender la cámara web
    async function activarCamara() {
        const constraints = { video: { width: width, height: height } };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.addEventListener("loadeddata", ajustarLienzo y Procesar);
    }

    function ajustarLienzo() {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        width = video.videoWidth;
        height = video.videoHeight;
        procesarFotograma();
    }

    // 3. Procesar el video frame por frame
    function procesarFotograma() {
        if (video.paused || video.ended) return;

        let startTimeMs = performance.now();
        
        // Ejecutar la segmentación en el fotograma actual
        imageSegmenter.segmentForVideo(video, startTimeMs, (result) => {
            dibujarContornoVerde(result.categoryMask);
        });

        // Solicitar el siguiente fotograma de forma nativa e infinita
        window.requestAnimationFrame(procesarFotograma);
    }

    // 4. Algoritmo matemático para pintar SÓLO el borde
    function dibujarContornoVerde(mask) {
        ctx.clearRect(0, 0, width, height);

        // Crear una imagen vacía en el canvas para manipular píxeles directamente
        const imgData = ctx.createImageData(width, height);
        const data = imgData.data; // Array de píxeles [R, G, B, A, R, G, B, A...]
        const maskData = mask.getAsUint8Array(); // Píxeles detectados por la IA (0 = fondo, 1 = objeto)

        // Grosor del contorno (en píxeles)
        const grosorBorde = 2; 

        for (let y = grosorBorde; y < height - grosorBorde; y++) {
            for (let x = grosorBorde; x < width - grosorBorde; x++) {
                
                const idx = y * width + x;
                
                // Si el píxel actual pertenece al objeto (valor > 0)
                if (maskData[idx] > 0) {
                    let esBorde = false;

                    // Revisar los píxeles vecinos (arriba, abajo, izquierda, derecha)
                    // Si algún vecino es fondo (0), este píxel es parte del contorno exterior
                    for (let dy = -grosorBorde; dy <= grosorBorde; dy++) {
                        for (let dx = -grosorBorde; dx <= grosorBorde; dx++) {
                            const vecinoIdx = (y + dy) * width + (x + dx);
                            if (maskData[vecinoIdx] === 0) {
                                esBorde = true;
                                break;
                            }
                        }
                        if (esBorde) break;
                    }

                    // Si se confirmó que es borde, lo pintamos de verde transparente
                    if (esBorde) {
                        const pixelInicio = idx * 4;
                        data[pixelInicio] = 0;       // Rojo (R)
                        data[pixelInicio + 1] = 255; // Verde (G)
                        data[pixelInicio + 2] = 0;   // Azul (B)
                        data[pixelInicio + 3] = 160; // Transparencia (Alpha: 0 es invisible, 255 es sólido)
                    }
                }
            }
        }

        // Renderizar los píxeles calculados en el lienzo
        ctx.putImageData(imgData, 0, 0);
    }

    // Iniciar la aplicación al cargar la página
    window.onload = inicializarIA;
</script>
</body>
</html>
