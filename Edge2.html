!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebAR Style Edge Detection</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Arial}
video,canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#ui{position:fixed;top:12px;left:12px;color:#fff;background:rgba(0,0,0,.55);padding:10px 14px;border-radius:10px;z-index:2}
</style>
</head>
<body>
<div id="ui">Loading camera...<br>Hold phone still for 5 seconds.</div>
<video id="v" autoplay playsinline muted></video>
<canvas id="c"></canvas>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script>
const video=v,canvas=c,ctx=canvas.getContext("2d");
const ui=document.getElementById("ui");
let stable=0,lastMotion=Date.now(),outlined=false;

async function start(){
 try{
  const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
  video.srcObject=s;
  await video.play();
  requestAnimationFrame(loop);
 }catch(e){ui.innerHTML="Camera error: "+e;}
}
window.addEventListener("devicemotion",e=>{
 const a=e.accelerationIncludingGravity;
 if(!a)return;
 const m=Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z);
 if(m>20){lastMotion=Date.now();outlined=false;}
});
function loop(){
 if(video.videoWidth){
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  ctx.drawImage(video,0,0);
  const sec=((Date.now()-lastMotion)/1000);
  ui.innerHTML=sec<5?("Hold still: "+(5-sec).toFixed(1)+" s"):"Detecting...";
  if(sec>=5 && !outlined && window.cv && cv.Mat){
    outlined=true;
    detect();
  }
 }
 requestAnimationFrame(loop);
}
function detect(){
 let src=cv.imread(canvas);
 let gray=new cv.Mat();
 let edges=new cv.Mat();
 cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
 cv.GaussianBlur(gray,gray,new cv.Size(5,5),0);
 cv.Canny(gray,edges,60,150);
 let out=new cv.Mat();
 cv.cvtColor(edges,out,cv.COLOR_GRAY2RGBA);
 let img=new ImageData(new Uint8ClampedArray(out.data),out.cols,out.rows);
 ctx.putImageData(img,0,0);
 src.delete();gray.delete();edges.delete();out.delete();
 ui.innerHTML="Contour generated. Move phone to reset.";
}
let wait=setInterval(()=>{if(window.cv&&cv.Mat){clearInterval(wait);start();}},200);
</script>
</body></html>
