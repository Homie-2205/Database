
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detección de Contornos WebAR en Tiempo Real</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #00ff88;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4 / 3;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Video oculto: solo sirve como fuente de datos */
        #video {
            display: none;
        }

        /* Canvas visible donde se dibujan los contornos */
        #canvas {
            width: 100%;
            height: 100%;
            background-color: #000;
            transform: scaleX(-1); /* Efecto espejo para mayor comodidad */
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            color: #00ff88;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <h1>Contornos en Tiempo Real (WebAR)</h1>
    
    <div class="container">
        <div id="loading" class="loading">Iniciando cámara...</div>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const loadingText = document.getElementById('loading');

        // 1. Solicitar acceso a la cámara del usuario
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, facingMode: "user" },
                    audio: false
                });
                video.srcObject = stream;
                video.addEventListener('loadedmetadata', () => {
                    loadingText.style.opacity = 0;
                    requestAnimationFrame(processVideoFrame);
                });
            } catch (err) {
                loadingText.innerText = "Error: No se pudo acceder a la cámara.";
                console.error("Error de acceso a la cámara: ", err);
            }
        }

        // 2. Procesar el video fotograma a fotograma
        function processVideoFrame() {
            if (video.paused || video.ended) return;

            // Dibujar el fotograma actual del video en el canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Obtener los datos de los píxeles (RGBA)
            const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const length = frame.data.length;

            // Crear un buffer intermedio para escala de grises
            const grayData = new Uint8ClampedArray(canvas.width * canvas.height);

            // Convertir a escala de grises para facilitar la detección de bordes
            for (let i = 0; i < length; i += 4) {
                const r = frame.data[i];
                const g = frame.data[i + 1];
                const b = frame.data[i + 2];
                // Fórmula de luminancia estándar
                grayData[i / 4] = 0.299 * r + 0.587 * g + 0.114 * b;
            }

            // Aplicar el Filtro Sobel (Detección de gradientes/bordes)
            const width = canvas.width;
            const height = canvas.height;
            
            // Reutilizamos el array original para escribir el resultado final
            // Limpiamos la pantalla pintándola casi negra para resaltar los bordes
            for (let i = 0; i < length; i += 4) {
                frame.data[i] = 10;     // R
                frame.data[i + 1] = 10; // G
                frame.data[i + 2] = 10; // B
                frame.data[i + 3] = 255;// A
            }

            // Kernel de Sobel
            // Horizontal (Gx)
            // [ -1, 0, 1 ]
            // [ -2, 0, 2 ]
            // [ -1, 0, 1 ]
            // Vertical (Gy)
            // [ -1, -2, -1 ]
            // [  0,  0,  0 ]
            // [  1,  2,  1 ]

            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    
                    const idx = y * width + x;

                    // Calcular gradiente horizontal (Gx)
                    const gX =
                        -1 * grayData[(y - 1) * width + (x - 1)] + 1 * grayData[(y - 1) * width + (x + 1)] +
                        -2 * grayData[(y) * width + (x - 1)]     + 2 * grayData[(y) * width + (x + 1)] +
                        -1 * grayData[(y + 1) * width + (x - 1)] + 1 * grayData[(y + 1) * width + (x + 1)];

                    // Calcular gradiente vertical (Gy)
                    const gY =
                        -1 * grayData[(y - 1) * width + (x - 1)] - 2 * grayData[(y - 1) * width + (x)] - 1 * grayData[(y - 1) * width + (x + 1)] +
                        1 * grayData[(y + 1) * width + (x - 1)] + 2 * grayData[(y + 1) * width + (x)] + 1 * grayData[(y + 1) * width + (x + 1)];

                    // Magnitud del gradiente
                    const magnitude = Math.sqrt(gX * gX + gY * gY);

                    // Umbral (Threshold) para filtrar el ruido de fondo
                    if (magnitude > 50) {
                        const pixelIdx = idx * 4;
                        // Pintar el contorno detectado de color Verde Neón
                        frame.data[pixelIdx] = 0;       // R
                        frame.data[pixelIdx + 1] = 255; // G (Verde completo)
                        frame.data[pixelIdx + 2] = 136; // B
                    }
                }
            }

            // Dibujar los bordes procesados de vuelta al lienzo
            ctx.putImageData(frame, 0, 0);

            // Repetir continuamente en el próximo refresco de pantalla
            requestAnimationFrame(processVideoFrame);
        }

        // Iniciar la aplicación al cargar la página
        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
</html>
