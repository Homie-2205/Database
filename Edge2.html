
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detección de Contornos</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial;
}

video,canvas{
    position:fixed;
    width:100%;
    height:100%;
    object-fit:cover;
    top:0;
    left:0;
}

#info{
    position:fixed;
    top:15px;
    left:15px;
    background:rgba(0,0,0,.6);
    color:white;
    padding:12px;
    border-radius:10px;
    z-index:10;
}
</style>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

</head>

<body>

<div id="info">
Esperando cámara...
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const info=document.getElementById("info");

let quietTime=0;
let lastMove=Date.now();
let detected=false;

navigator.mediaDevices.getUserMedia({
video:{
facingMode:"environment"
}
})
.then(stream=>{
video.srcObject=stream;
video.play();
requestAnimationFrame(loop);
});

window.addEventListener("devicemotion",e=>{

let a=e.accelerationIncludingGravity;

if(!a)return;

let movimiento=Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z);

if(movimiento>20){

lastMove=Date.now();
detected=false;

}

});

function loop(){

if(video.videoWidth){

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

ctx.drawImage(video,0,0);

quietTime=(Date.now()-lastMove)/1000;

if(quietTime<5){

info.innerHTML="Mantén el teléfono quieto<br>"+(5-quietTime).toFixed(1)+" segundos";

}else{

if(!detected && window.cv){

detected=true;
detectar();

}

}

}

requestAnimationFrame(loop);

}

function detectar(){

let src=cv.imread(canvas);

let gray=new cv.Mat();
let blur=new cv.Mat();
let edges=new cv.Mat();
let contours=new cv.MatVector();
let hierarchy=new cv.Mat();

cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);

cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);

cv.Canny(blur,edges,60,150);

cv.findContours(
edges,
contours,
hierarchy,
cv.RETR_EXTERNAL,
cv.CHAIN_APPROX_SIMPLE
);

ctx.drawImage(video,0,0);

ctx.lineWidth=3;
ctx.strokeStyle="lime";

for(let i=0;i<contours.size();i++){

let cnt=contours.get(i);

if(cv.contourArea(cnt)>300){

let rect=cv.boundingRect(cnt);

ctx.strokeRect(
rect.x,
rect.y,
rect.width,
rect.height
);

}

cnt.delete();

}

src.delete();
gray.delete();
blur.delete();
edges.delete();
contours.delete();
hierarchy.delete();

info.innerHTML="Contornos detectados";

}

</script>

</body>
</html>
