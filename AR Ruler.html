<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Enterprise Web AR Ruler Pro</title>
    
    <!-- Core External Frameworks via Secure CDN -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>

    <style>
        /* Modern UI/UX Overlay Styles */
        :root {
            --primary-color: #00f3ff;
            --accent-color: #ff0055;
            --bg-glass: rgba(10, 15, 30, 0.75);
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Top HUD Dashboard */
        #hud-container {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 450px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 15px 20px;
            color: #ffffff;
            z-index: 9999;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            pointer-events: auto;
        }

        #hud-container h1 {
            margin: 0 0 4px 0;
            font-size: 1.25rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--primary-color);
        }

        #hud-container p {
            margin: 0 0 12px 0;
            font-size: 0.8rem;
            color: #b0b5c0;
        }

        /* Live Tracker Metrics Panel */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .status-badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            border-radius: 8px;
            font-size: 0.75rem;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .status-badge.active {
            border-color: var(--primary-color);
            background: rgba(0, 243, 255, 0.1);
            color: var(--primary-color);
        }

        .status-badge.missing {
            border-color: var(--accent-color);
            background: rgba(255, 0, 85, 0.1);
            color: var(--accent-color);
        }

        #measurement-display {
            font-size: 1.8rem;
            font-weight: 800;
            font-family: monospace;
            color: #ffffff;
            text-shadow: 0 0 10px var(--primary-color);
            padding: 8px 0;
            border-top: 1px solid var(--border-glass);
        }

        /* Error Handler Screen */
        #error-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d0f14;
            color: #ffffff;
            z-index: 10000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 30px;
            text-align: center;
        }

        #error-screen h2 {
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        /* Hide Default Framework Overlays */
        .a-enter-vr, .a-enter-ar {
            display: none !important;
        }
    </style>
</head>

    <div id="error-screen">
        <h2>Security Requirement</h2>
        <p id="error-message">Camera access failed. WebXR and AR.js require an HTTPS connection or localhost environment to run properly.</p>
    </div>

    <!-- UI Overlay Dashboard -->
    <div id="hud-container">
        <h1>AR Ruler Engine</h1>
        <p>Align both markers within the viewport camera grid</p>
        
        <div class="metrics-grid">
            <div id="badge-m1" class="status-badge missing">Point A (Hiro): LOST</div>
            <div id="badge-m2" class="status-badge missing">Point B (Kanji): LOST</div>

        <div id="measurement-display">SYSTEM INIT...</div>

</html>
