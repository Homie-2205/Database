

        <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Regla de Realidad Aumentada (WebXR)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        /* Contenedor de la interfaz de usuario */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none; /* Permite tocar a través de la UI profunda */
            z-index: 10;
        }

        /* Panel de información superior */
        .header {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px;
            text-align: center;
            backdrop-filter: blur(5px);
            border-bottom: 2px solid #00ffcc;
        }

        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .header p {
            margin: 5px 0 0 0;
            font-size: 0.85rem;
            color: #ccc;
        }

        /* Indicador de distancia flotante */
        #distance-panel {
            background: rgba(20, 20, 20, 0.85);
            color: #00ffcc;
            align-self: center;
            margin-top: 20px;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            border: 1px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            display: none;
        }

        /* Retícula/Mira en el centro de la pantalla */
        #reticle-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
            pointer-events: none;
            display: block;
        }

        /* Panel de botones inferior */
        .controls {
            padding: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            pointer-events: auto; /* Reactiva los toques para los botones */
        }

        .btn {
            background: #00ffcc;
            color: #111;
            border: none;
            padding: 15px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 255, 204, 0.4);
            transition: all 0.3s ease;
        }

        .btn:active {
            transform: scale(0.95);
            background: #00cca3;
        }

        .btn-reset {
            background: #ff3366;
            color: #fff;
            box-shadow: 0 4px 10px rgba(255, 51, 102, 0.4);
        }

        .btn-reset:active {
            background: #cc2552;
        }

        /* Mensaje de error o falta de soporte */
        #error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(255,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            display: none;
            width: 80%;
            max-width: 400px;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="ui-container">
        <div class="header">
            <h1>Regla AR Pro</h1>
            <p>Apunta al suelo para detectar superficies</p>
        </div>

        <div id="distance-panel">0.00 m</div>

        <div class="controls">
            <button id="btn-place" class="btn">Fijar Punto</button>
            <button id="btn-reset" class="btn btn-reset">Reiniciar</button>
        </div>
    </div>

    <div id="reticle-guide"></div>
    <div id="error-message">Este dispositivo o navegador no soporta Realidad Aumentada (WebXR). Prueba con Chrome en Android.</div>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        // Variables globales
        let container, camera, scene, renderer;
        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        // Lógica de medición
        let points = []; // Almacena las coordenadas de los puntos colocados
        let line = null;  // Objeto visual de la línea

        // Elementos del DOM
        const btnPlace = document.getElementById('btn-place');
        const btnReset = document.getElementById('btn-reset');
        const distancePanel = document.getElementById('distance-panel');
        const reticleGuide = document.getElementById('reticle-guide');

        init();

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            // 1. Configuración de la Escena y Cámara
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // 2. Configuración del Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // 3. Iluminación básica
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            // 4. Configurar Botón de AR de Three.js
            const arButton = ARButton.createButton(renderer, { 
                requiredFeatures: ['hit-test'],
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.getElementById('ui-container') }
            });
            document.body.appendChild(arButton);

            // 5. Crear la retícula (el anillo indicador que se posa en el suelo)
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.04, 0.05, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0x00ffcc })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // 6. Eventos de los botones de la interfaz
            btnPlace.addEventListener('click', onPlacePoint);
            btnReset.addEventListener('click', clearMeasurement);

            // 7. Ajuste de pantalla si cambia el tamaño
            window.addEventListener('resize', onWindowResize);

            // Ciclo de renderizado loop de WebXR
            renderer.setAnimationLoop(render);
        }

        // Función que coloca un punto en las coordenadas actuales de la retícula
        function onPlacePoint() {
            if (!reticle.visible) return; // Si no hay superficie detectada, no hace nada

            // Extraer posición de la matriz de la retícula
            const position = new THREE.Vector3();
            position.setFromMatrixPosition(reticle.matrix);

            // Crear una pequeña esfera visual en el punto
            const sphereGeo = new THREE.SphereGeometry(0.015, 16, 16);
            const sphereMat = new THREE.MeshBasicMaterial({ color: 0xff3366 });
            const sphere = new THREE.Mesh(sphereGeo, sphereMat);
            sphere.position.copy(position);
            scene.add(sphere);

            // Guardar el punto y el objeto visual
            points.push({
                coords: position,
                mesh: sphere
            });

            // Si ya hay dos o más puntos, dibujamos/actualizamos la línea y medimos
            if (points.length >= 2) {
                updateLine();
                calculateDistance();
            }
        }

        // Dibuja una línea entre los puntos acumulados
        function updateLine() {
            if (line) scene.remove(line);

            const material = new THREE.LineBasicMaterial({ 
                color: 0x00ffcc, 
                linewidth: 3 // Nota: en WebGL el grosor suele ignorarse y quedarse en 1px
            });

            const geometry = new THREE.BufferGeometry().setFromPoints(
                points.map(p => p.coords)
            );

            line = new THREE.Line(geometry, material);
            scene.add(line);
        }

        // Calcula la distancia matemática entre el primer y el último punto
        function calculateDistance() {
            const p1 = points[points.length - 2].coords;
            const p2 = points[points.length - 1].coords;

            // Distancia Euclidiana 3D
            const dist = p1.distanceTo(p2);

            // Mostrar el panel y actualizar el texto (convertido a metros y centímetros)
            distancePanel.style.display = 'block';
            if(dist < 1) {
                distancePanel.innerText = `${(dist * 100).toFixed(1)} cm`;
            } else {
                distancePanel.innerText = `${dist.toFixed(2)} m`;
            }
        }

        // Resetea toda la escena
        function clearMeasurement() {
            // Eliminar esferas
            points.forEach(p => scene.remove(p.mesh));
            points = [];

            // Eliminar línea
            if (line) {
                scene.remove(line);
                line = null;
            }

            // Ocultar panel de distancia
            distancePanel.style.display = 'none';
            distancePanel.innerText = "0.00 m";
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Bucle de renderizado (se ejecuta a los FPS de tu pantalla AR)
        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                // Solicitar origen de Hit-Test (Rastreo de superficies) si no existe
                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then((viewerSpace) => {
                        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });

                    session.addEventListener('end', () => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });

                    hitTestSourceRequested = true;
                }

                // Si ya tenemos el origen de rastreo de impacto, calculamos la posición
                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);

                    if (hitTestResults.length) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(referenceSpace);

                        // Si detectamos superficie, mostramos la retícula y ocultamos la mira 2D fija
                        reticle.visible = true;
                        reticle.matrix.fromArray(pose.transform.matrix);
                        reticleGuide.style.display = 'none';
                    } else {
                        // Si se pierde la superficie, dejamos la guía central fija
                        reticle.visible = false;
                        reticleGuide.style.display = 'block';
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
