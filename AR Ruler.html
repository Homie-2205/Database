<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Access Test</title>
    <style>
        /* CSS Styles */
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #ffffff;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 640px;
            padding: 20px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background-color: #1e1e1e;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            aspect-ratio: 4 / 3;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirrors the camera for a natural feel */
        }

        .status-message {
            margin-top: 15px;
            font-size: 1rem;
            color: #bb86fc;
        }

        .error-message {
            color: #cf6679;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Camera Feed</h2>
        <div class="video-wrapper">
            <video id="webcam" autoplay playsinline></video>
        </div>
        <div id="status" class="status-message">Initializing camera...</div>
    </div>

    <script>
        // JavaScript Logic
        const video = document.getElementById('webcam');
        const statusDiv = document.getElementById('status');

        async function initCamera() {
            try {
                // Request both video and audio permissions if needed, or just video
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "user", // Use "environment" for the back camera on phones
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }, 
                    audio: false 
                });
                
                // Assign the stream to the video element
                video.srcObject = stream;
                statusDiv.textContent = "Camera connected successfully.";
                
            } catch (error) {
                console.error("Error accessing the camera: ", error);
                statusDiv.classList.add('error-message');
                
                if (error.name === 'NotAllowedError') {
                    statusDiv.textContent = "Permission denied. Please grant camera access in your browser settings.";
                } else if (error.name === 'NotFoundError') {
                    statusDiv.textContent = "No camera device found on this system.";
                } else {
                    statusDiv.textContent = `Error: ${error.message}. (Note: Camera APIs require HTTPS or localhost).`;
                }
            }
        }

        // Run the function when the page loads
        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
</html>
