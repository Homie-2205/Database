<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regla Web AR por Botones</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="ui-container">
        <h2>Regla AR Profesional</h2>
        <p id="status">Ubícate en el inicio y presiona "Punto A"</p>
        
        <div id="distance-display">
            Distancia: <span id="distance-value">0.00</span> m
        </div>
        
        <div class="btn-group">
            <button id="btn-A" class="action-btn">Fijar Punto A</button>
            <button id="btn-B" class="action-btn" disabled>Fijar Punto B</button>
        </div>
        
        <button id="reset-btn">Reiniciar Medición</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-entity id="marker-A" geometry="primitive: sphere; radius: 0.03" material="color: #ff3b30;" visible="false"></a-entity>
        <a-entity id="marker-B" geometry="primitive: sphere; radius: 0.03" material="color: #34c759;" visible="false"></a-entity>
        <a-entity id="line-AB" line="color: #ffcc00; start: 0 0 0; end: 0 0 0" visible="false"></a-entity>

        <a-entity camera id="main-camera" look-controls></a-entity>
    </a-scene>
<style>  #ui-container {
    position: absolute;
    bottom: 30px; /* Movido abajo para que sea más ergonómico en celulares */
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: rgba(20, 20, 20, 0.85);
    backdrop-filter: blur(5px);
    color: white;
    padding: 20px;
    border-radius: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    width: 85%;
    max-width: 360px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

#ui-container h2 {
    margin: 0 0 5px 0;
    font-size: 1.1rem;
    letter-spacing: 1px;
    color: #0a84ff;
}

#status {
    margin: 5px 0 15px 0;
    font-size: 0.85rem;
    color: #eaeaea;
}

#distance-display {
    font-size: 1.8rem;
    font-weight: bold;
    margin-bottom: 15px;
    color: #34c759;
}

.btn-group {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.action-btn {
    flex: 1;
    background: #0a84ff;
    border: none;
    color: white;
    padding: 12px 10px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 0.9rem;
    cursor: pointer;
}

.action-btn:disabled {
    background: #555;
    color: #888;
    cursor: not-allowed;
}

#btn-B {
    background: #30d158;
}

#btn-B:disabled {
    background: #225530;
    color: #666;
}

#reset-btn {
    background: transparent;
    border: 1px solid #ff453a;
    color: #ff453a;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.8rem;
    cursor: pointer;
    width: 100%;
}</style>
    <script>   let posA = null;
let posB = null;

// Elementos de la interfaz (UI)
const btnA = document.getElementById('btn-A');
const btnB = document.getElementById('btn-B');
const resetBtn = document.getElementById('reset-btn');
const statusText = document.getElementById('status');
const distanceValue = document.getElementById('distance-value');

// Elementos 3D de la escena
const markerA = document.getElementById('marker-A');
const markerB = document.getElementById('marker-B');
const lineAB = document.getElementById('line-AB');
const cameraEl = document.getElementById('main-camera');

// BOTÓN A: Guarda la posición inicial
btnA.addEventListener('click', () => {
    // Captura la posición de la cámara en el mundo 3D
    const camPos = cameraEl.object3D.position;
    
    posA = { x: camPos.x, y: camPos.y, z: camPos.z };
    
    // Coloca la esfera roja en esa posición
    markerA.setAttribute('position', `${posA.x} ${posA.y} ${posA.z}`);
    markerA.setAttribute('visible', 'true');
    
    // Cambia estados de la interfaz
    btnA.disabled = true;
    btnB.disabled = false;
    statusText.innerText = "Punto A guardado. Camina hacia el final y presiona 'Punto B'";
});

// BOTÓN B: Guarda la posición final y calcula
btnB.addEventListener('click', () => {
    if (!posA) return;

    const camPos = cameraEl.object3D.position;
    posB = { x: camPos.x, y: camPos.y, z: camPos.z };
    
    // Coloca la esfera verde
    markerB.setAttribute('position', `${posB.x} ${posB.y} ${posB.z}`);
    markerB.setAttribute('visible', 'true');
    
    // Dibuja la línea entre los dos puntos
    lineAB.setAttribute('line', {
        start: `${posA.x} ${posA.y} ${posA.z}`,
        end: `${posB.x} ${posB.y} ${posB.z}`
    });
    lineAB.setAttribute('visible', 'true');
    
    // Calcula la distancia matemática 3D
    const distance = Math.sqrt(
        Math.pow(posB.x - posA.x, 2) +
        Math.pow(posB.y - posA.y, 2) +
        Math.pow(posB.z - posA.z, 2)
    );
    
    // Muestra el resultado
    distanceValue.innerText = distance.toFixed(2);
    btnB.disabled = true;
    statusText.innerText = "Medición realizada con éxito.";
});

// BOTÓN REINICIAR
resetBtn.addEventListener('click', () => {
    posA = null;
    posB = null;
    
    markerA.setAttribute('visible', 'false');
    markerB.setAttribute('visible', 'false');
    lineAB.setAttribute('visible', 'false');
    
    distanceValue.innerText = "0.00";
    btnA.disabled = false;
    btnB.disabled = true;
    statusText.innerText = "Ubícate en el inicio y presiona 'Punto A'";
});</script>
</body>
</html>
