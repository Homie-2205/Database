<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Web AR Ruler</title>
    <!-- Include A-Frame and AR.js -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body style="margin: 0px; overflow: hidden;">

    <!-- Information HUD -->
    <div id="ui-container">
        <h1>AR Ruler</h1>
        <p>Point your camera at two markers to measure distance.</p>
        <div id="measurement-box">
            Distance: <span id="distance-output">--</span> meters
        </div>
    </div>

    <!-- AR Scene -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Marker 1 (Hiro default) -->
        <a-marker preset="hiro" id="marker-1">
            <a-sphere color="#EF2D5E" radius="0.1"></a-sphere>
            
        </a-marker>

        <!-- Marker 2 (Kanji default) -->
        <a-marker preset="kanji" id="marker-2">
            <a-sphere color="#4CC3D9" radius="0.1"></a-sphere>
            
        </a-marker>

        <!-- Static Camera -->
        <style>

* {
    box-sizing: border-box;
}

#ui-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 20px;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    font-family: Arial, sans-serif;
    z-index: 1000;
    text-align: center;
    pointer-events: none; /* Allows tapping through UI to the camera */
}

#ui-container h1 {
    margin: 0 0 5px 0;
    font-size: 1.5rem;
}

#ui-container p {
    margin: 0;
    font-size: 0.9rem;
    color: #ddd;
}

#measurement-box {
    margin-top: 15px;
    font-size: 1.2rem;
    font-weight: bold;
    color: #4CC3D9;
    background: rgba(255, 255, 255, 0.1);
    padding: 10px;
    border-radius: 5px;
    display: inline-block;
}

</style>
        
    </a-scene>

    <!-- Load Custom Logic -->
    <script src="app.js"></script>

</body>
</html>
