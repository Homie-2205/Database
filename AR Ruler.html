
      <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Regla Interactiva AR.js</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        /* Estilos para la interfaz de usuario superpuesta */
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #ar-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: none; /* Permite interactuar con la cámara detrás */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .panel-top {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 15px;
            text-align: center;
            pointer-events: auto;
            border-bottom: 3px solid #ff9900;
        }

        .panel-top h1 {
            margin: 0;
            font-size: 1.3rem;
        }

        .panel-top p {
            margin: 5px 0 0 0;
            font-size: 0.85rem;
            color: #ddd;
        }

        .panel-middle {
            align-self: center;
            background: rgba(255, 153, 0, 0.9);
            color: #000;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1.6rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-top: 20px;
        }

        .panel-bottom {
            background: rgba(0, 0, 0, 0.75);
            padding: 20px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 10px;
        }

        .control-label {
            color: #fff;
            font-weight: bold;
            min-width: 70px;
        }

        /* Deslizadores personalizados */
        .slider {
            flex-grow: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 10px;
            border-radius: 5px;
            background: #555;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ff9900;
            cursor: pointer;
        }

        .btn-reset {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-reset:active {
            background: #c0392b;
        }
