<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regla Web AR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="ui-container">
        <h2>Regla AR</h2>
        <p id="status">Apunta al suelo y toca para fijar el Punto A</p>
        <div id="distance-display">Distancia: <span id="distance-value">0.00</span> m</div>
        <button id="reset-btn">Reiniciar</button>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
        renderer="logarithmicDepthBuffer: true;">
        
        <a-entity id="point-A" geometry="primitive: sphere; radius: 0.02" material="color: #ff0000;" visible="false"></a-entity>
        <a-entity id="point-B" geometry="primitive: sphere; radius: 0.02" material="color: #00ff00;" visible="false"></a-entity>
        
        <a-entity id="measurement-line" line="color: #ffff00; start: 0 0 0; end: 0 0 0" visible="false"></a-entity>

        <a-entity camera look-controls cursor="rayOrigin: mouse"></a-entity>
    </a-scene>

    <style>  #ui-container {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10; /* Asegura que esté por encima de la cámara */
    background: rgba(0, 0, 0, 0.75);
    color: white;
    padding: 15px 25px;
    border-radius: 15px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    width: 80%;
    max-width: 320px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

#ui-container h2 {
    margin: 0 0 5px 0;
    font-size: 1.2rem;
    color: #4af;
}

#status {
    margin: 5px 0;
    font-size: 0.9rem;
    color: #ccc;
}

#distance-display {
    font-size: 1.4rem;
    font-weight: bold;
    margin: 15px 0;
    color: #2fed7b;
}

#reset-btn {
    background: #ff3b30;
    border: none;
    color: white;
    padding: 8px 15px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
}

#reset-btn:hover {
    background: #d32f2f;
} </style><script> let pointA = null;
let pointB = null;

const statusText = document.getElementById('status');
const distanceValue = document.getElementById('distance-value');
const resetBtn = document.getElementById('reset-btn');

const elA = document.getElementById('point-A');
const elB = document.getElementById('point-B');
const line = document.getElementById('measurement-line');
const scene = document.querySelector('a-scene');

// Escuchar el click en la pantalla/escena
scene.addEventListener('click', (event) => {
    // Obtenemos la posición actual de la cámara en el espacio 3D
    const cameraEl = document.querySelector('[camera]');
    const cameraPosition = cameraEl.object3D.position;

    // Proyectamos un punto un poco hacia adelante de la cámara (ej. 0.5 metros)
    // para simular que estamos marcando lo que la cámara está apuntando
    const direction = new THREE.Vector3();
    cameraEl.object3D.getWorldDirection(direction);
    
    // Calculamos el punto exacto en el espacio frente a nosotros
    const targetPosition = {
        x: cameraPosition.x - direction.x * 0.5,
        y: cameraPosition.y - direction.y * 0.5,
        z: cameraPosition.z - direction.z * 0.5
    };

    if (!pointA) {
        // Fijar Primer Punto
        pointA = targetPosition;
        elA.setAttribute('position', `${pointA.x} ${pointA.y} ${pointA.z}`);
        elA.setAttribute('visible', 'true');
        statusText.innerText = "Punto A fijado. Mídete y toca para el Punto B";
    } else if (!pointB) {
        // Fijar Segundo Punto
        pointB = targetPosition;
        elB.setAttribute('position', `${pointB.x} ${pointB.y} ${pointB.z}`);
        elB.setAttribute('visible', 'true');

        // Dibujar línea entre A y B
        line.setAttribute('line', {
            start: `${pointA.x} ${pointA.y} ${pointA.z}`,
            end: `${pointB.x} ${pointB.y} ${pointB.z}`
        });
        line.setAttribute('visible', 'true');

        // Calcular la distancia real
        const distance = calculateDistance(pointA, pointB);
        distanceValue.innerText = distance.toFixed(2); // Dos decimales
        statusText.innerText = "¡Medición completada!";
    }
});

// Función matemática para calcular distancia 3D (Euclidiana)
function calculateDistance(p1, p2) {
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const dz = p2.z - p1.z;
    return Math.sqrt(dx * dx + dy * dy + dz * dz);
}

// Botón de Reinicio
resetBtn.addEventListener('click', (e) => {
    e.stopPropagation(); // Evita que el click cuente como un nuevo punto
    pointA = null;
    pointB = null;
    elA.setAttribute('visible', 'false');
    elB.setAttribute('visible', 'false');
    line.setAttribute('visible', 'false');
    distanceValue.innerText = "0.00";
    statusText.innerText = "Apunta al suelo y toca para fijar el Punto A";
});</script>
</body>
</html>
