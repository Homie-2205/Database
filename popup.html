<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edge Detection</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#202124;
    color:white;
    text-align:center;
    margin:0;
    padding:20px;
}

h1{
    color:#00ff88;
}

canvas{
    border:2px solid #00ff88;
    margin-top:20px;
    max-width:90%;
}

input{
    margin-top:20px;
}
</style>
</head>
<body>

<h1>Detección de Bordes (Edge Detection)</h1>

<input type="file" id="upload">

<br>

<canvas id="canvas"></canvas>

<script>

const upload=document.getElementById("upload");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

upload.addEventListener("change",function(e){

const file=e.target.files[0];

const img=new Image();

img.onload=function(){

canvas.width=img.width;
canvas.height=img.height;

ctx.drawImage(img,0,0);

let imageData=ctx.getImageData(0,0,canvas.width,canvas.height);

let data=imageData.data;

let output=new Uint8ClampedArray(data);

for(let y=1;y<canvas.height-1;y++){

for(let x=1;x<canvas.width-1;x++){

let i=(y*canvas.width+x)*4;

let left=((y*canvas.width+(x-1))*4);
let right=((y*canvas.width+(x+1))*4);
let top=(((y-1)*canvas.width+x)*4);
let bottom=(((y+1)*canvas.width+x)*4);

let gx=Math.abs(data[right]-data[left]);
let gy=Math.abs(data[bottom]-data[top]);

let edge=gx+gy;

output[i]=edge;
output[i+1]=edge;
output[i+2]=edge;
output[i+3]=255;

}

}

imageData.data.set(output);

ctx.putImageData(imageData,0,0);

}

img.src=URL.createObjectURL(file);

});

</script>

</body>
</html>
