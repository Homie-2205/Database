<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation Coordinator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Find My Coordinates</h2>
    <p>Click the button below to display your current latitude and longitude.</p>
    
    <button onclick="getLocation()">Get Coordinates</button>
    
    <div id="result"></div>

    <script>
        const resultDiv = document.getElementById("result");

        function getLocation() {
            // Check if the browser supports the Geolocation API
            if (!navigator.geolocation) {
                resultDiv.innerHTML = "Geolocation is not supported by your browser.";
                return;
            }

            resultDiv.innerHTML = "Locating...";

            // Configuration options for high accuracy (important for mobile/Android devices)
            const options = {
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 0
            };

            // Request the current position
            navigator.geolocation.getCurrentPosition(showPosition, showError, options);
        }

        function showPosition(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            
            resultDiv.innerHTML = `Latitude: ${latitude} <br> Longitude: ${longitude}`;
        }

        function showError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    resultDiv.innerHTML = "User denied the request for Geolocation.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    resultDiv.innerHTML = "Location information is unavailable.";
                    break;
                case error.TIMEOUT:
                    resultDiv.innerHTML = "The request to get user location timed out.";
                    break;
                case error.UNKNOWN_ERROR:
                    resultDiv.innerHTML = "An unknown error occurred.";
                    break;
            }
        }
    </script>

</body>
</html>
