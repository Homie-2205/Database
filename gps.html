<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation Coordinator</title>
    <style>
        
        :root {
            --primary-color: #4facfe;
            --secondary-color: #00f2fe;
            --text-color: #333;
            --bg-gradient: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at center, #232526 0%, #414345 100%);
            color: #fff;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        button {
            background: var(--bg-gradient);
            color: white;
            border: none;
            padding: 15px 32px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.4);
            opacity: 0.95;
        }

        button:active {
            transform: translateY(1px);
        }

        #result {
            margin-top: 30px;
            font-size: 20px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            min-height: 30px;
        }



    </style>
</head>
<body>

    <h2>GPS Santa Elena</h2>
    <p>Click the button below to display your current latitude and longitude.</p>
    
    <button onclick="getLocation()">Get Coordinates</button>
    
    <div id="result"></div>

    <script>
        const resultDiv = document.getElementById("result");

        function getLocation() {
            // Check if the browser supports the Geolocation API
            if (!navigator.geolocation) {
                resultDiv.innerHTML = "Geolocation is not supported by your browser.";
                return;
            }

            resultDiv.innerHTML = "Locating...";

            // Configuration options for high accuracy (important for mobile/Android devices)
            const options = {
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 0
            };

            // Request the current position
            navigator.geolocation.getCurrentPosition(showPosition, showError, options);
        }

        function showPosition(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            
            resultDiv.innerHTML = `Latitude: ${latitude} <br> Longitude: ${longitude}`;
        }

        function showError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    resultDiv.innerHTML = "User denied the request for Geolocation.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    resultDiv.innerHTML = "Location information is unavailable.";
                    break;
                case error.TIMEOUT:
                    resultDiv.innerHTML = "The request to get user location timed out.";
                    break;
                case error.UNKNOWN_ERROR:
                    resultDiv.innerHTML = "An unknown error occurred.";
                    break;
            }
        }
    </script>

      <button onclick="getLocation()">Get Coordinates</button>
     <a href="index.html" class="nav-button">Herramientas Digitales </a>
    

</body>
</html>
